spring:
  jackson:
    mapper:
      accept-case-insensitive-enums: true
  application:
    name: demo

  datasource:
    url: jdbc:h2:mem:midb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: admin
    password: admin

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

security:
  jwt:
    secret: bXlTdXBlclNlY3JldEtleUZvclRvRG9MaXN0QXBpUmVzdDEyMzQ1Ng==
    expiration: 86400000 # 24 horas en milisegundos (24 * 60 * 60 * 1000)

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha